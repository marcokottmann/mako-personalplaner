<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <title>Mako Personalplaner</title>

  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Mako Personalplaner">
  <meta name="apple-mobile-web-app-title" content="Mako Personalplaner">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./mako-icon-192.png">
  <link rel="apple-touch-icon" href="./mako-icon-192.png">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f4f6f8;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f6f8;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 24px;
      text-align: center;
      z-index: -1;
    }

    .fallback a {
      color: #111827;
      font-weight: 700;
    }

    #pushButton {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 999999;

      display: block;

      border: 0;
      border-radius: 14px;
      padding: 13px 16px;

      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 700;

      background: #111827;
      color: #ffffff;

      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);

      cursor: pointer;
    }

    #pushButton:disabled {
      opacity: 0.65;
      cursor: default;
    }
  </style>
</head>

<body>

  <div class="fallback">
    <div>
      <strong>Mako Personalplaner</strong>
      <br><br>
      Falls die App nicht lädt:
      <a href="https://script.google.com/macros/s/AKfycbwmWUMS8xv989OHGPNeqAtENmUdLUAeVZUUVieThSbBQcFbtPfFEJETToLpViYuGkXn/exec">
        direkt öffnen
      </a>
    </div>
  </div>

  <iframe
    id="app"
    title="Mako Personalplaner"
    src="https://script.google.com/macros/s/AKfycbwmWUMS8xv989OHGPNeqAtENmUdLUAeVZUUVieThSbBQcFbtPfFEJETToLpViYuGkXn/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <button
    id="pushButton"
    type="button"
  >
    🔔 Benachrichtigungen aktivieren
  </button>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>

  <script>
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyD834l6nojbMm0_As_82mkQ9lfah9p1EDk",
      authDomain: "mako-personalplaner.firebaseapp.com",
      projectId: "mako-personalplaner",
      storageBucket: "mako-personalplaner.firebasestorage.app",
      messagingSenderId: "606569515655",
      appId: "1:606569515655:web:fc90bc032679ad8f814622"
    };

    const VAPID_KEY =
      "BNxTtWe7mJ7Xrpz7u-MmRYmEz8raYyWlgg-JiM8GhauGznsy26_x9NjEUNRGM2koEn6hGbM9y4YRakGvKWgQ3Sc";

    const appFrame =
      document.getElementById("app");

    const pushButton =
      document.getElementById("pushButton");

    let currentUsername = "";
    let serviceWorkerRegistration = null;
    let messaging = null;

    firebase.initializeApp(FIREBASE_CONFIG);

    messaging =
      firebase.messaging();


    function updatePushButton() {

      // TESTVERSION:
      // Button bleibt sichtbar, damit wir prüfen können,
      // ob die neue GitHub-Version geladen wird.
      pushButton.style.display =
        "block";
    }


    async function registerCurrentDevice() {

      if (!currentUsername) {
        alert(
          "Bitte zuerst im Mako Personalplaner anmelden."
        );
        return;
      }

      if (!serviceWorkerRegistration) {
        alert(
          "Der Push-Dienst ist noch nicht bereit. Bitte die App kurz schließen und erneut öffnen."
        );
        return;
      }

      try {

        const token =
          await messaging.getToken({
            vapidKey: VAPID_KEY,
            serviceWorkerRegistration:
              serviceWorkerRegistration
          });

        if (!token) {
          alert(
            "Es konnte noch kein Push-Token erstellt werden."
          );
          return;
        }

        appFrame.contentWindow.postMessage(
          {
            type: "MAKO_PUSH_TOKEN",
            username: currentUsername,
            token: token,
            platform:
              navigator.userAgent || ""
          },
          "*"
        );

        alert(
          "✅ Benachrichtigungen wurden aktiviert."
        );

      } catch (error) {

        console.error(
          "Push-Registrierung fehlgeschlagen:",
          error
        );

        alert(
          "Push-Registrierung fehlgeschlagen: " +
          (error && error.message
            ? error.message
            : error)
        );
      }
    }


    pushButton.addEventListener(
      "click",
      async function() {

        pushButton.disabled = true;

        try {

          if (!("Notification" in window)) {
            alert(
              "Dieses Gerät unterstützt Browser-Benachrichtigungen nicht."
            );
            return;
          }

          const permission =
            await Notification.requestPermission();

          if (permission === "granted") {

            await registerCurrentDevice();

          } else {

            alert(
              "Benachrichtigungen wurden nicht erlaubt."
            );
          }

        } catch (error) {

          console.error(
            "Benachrichtigungsfreigabe fehlgeschlagen:",
            error
          );

          alert(
            "Benachrichtigungsfreigabe fehlgeschlagen."
          );

        } finally {

          pushButton.disabled = false;
        }
      }
    );


    window.addEventListener(
      "message",
      function(event) {

        const data =
          event.data || {};

        if (
          data.type ===
          "MAKO_USER_LOGIN"
        ) {

          currentUsername =
            String(
              data.username || ""
            ).trim();

          console.log(
            "Mako Benutzer für Push:",
            currentUsername
          );

          if (
            "Notification" in window &&
            Notification.permission === "granted"
          ) {
            registerCurrentDevice();
          }
        }

        if (
          data.type ===
          "MAKO_USER_LOGOUT"
        ) {

          currentUsername = "";
        }
      }
    );


    if ("serviceWorker" in navigator) {

      window.addEventListener(
        "load",
        async function() {

          try {

            serviceWorkerRegistration =
              await navigator.serviceWorker.register(
                "./service-worker.js"
              );

            await navigator.serviceWorker.ready;

            console.log(
              "Mako Service Worker bereit."
            );

          } catch (error) {

            console.error(
              "Service Worker konnte nicht registriert werden:",
              error
            );
          }
        }
      );
    }


    messaging.onMessage(
      function(payload) {

        const data =
          payload.data || {};

        const title =
          data.title ||
          "Mako Personalplaner";

        const body =
          data.body ||
          "Neue Mitteilung";

        if (
          serviceWorkerRegistration &&
          Notification.permission === "granted"
        ) {

          serviceWorkerRegistration.showNotification(
            title,
            {
              body: body,
              icon: "./mako-icon-192.png",
              badge: "./mako-icon-192.png",
              data: {
                url:
                  data.url || "./"
              }
            }
          );
        }
      }
    );
  </script>

</body>
</html>
