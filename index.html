<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mako Personalplaner</title>

  <meta name="theme-color" content="#ffffff">
  <meta name="application-name" content="Mako Personalplaner">
  <meta name="apple-mobile-web-app-title" content="Mako Personalplaner">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./mako-icon-192.png">
  <link rel="apple-touch-icon" href="./mako-icon-192.png">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #f4f6f8;
      overflow: hidden;
    }

    #app {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f4f6f8;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 24px;
      text-align: center;
      z-index: -1;
    }

    .fallback a {
      color: #111827;
      font-weight: 700;
    }

    #pushButton {
      position: fixed;
      right: 14px;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 9999;
      display: none;
      border: 0;
      border-radius: 999px;
      padding: 11px 16px;
      background: #111827;
      color: #ffffff;
      font: 700 14px/1.2 Arial, sans-serif;
      box-shadow: 0 6px 22px rgba(0,0,0,.20);
      cursor: pointer;
    }

    #pushButton:disabled {
      opacity: .65;
      cursor: default;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
</head>

<body>
  <div class="fallback">
    <div>
      <strong>Mako Personalplaner</strong><br><br>
      Falls die App nicht lädt:
      <a href="https://script.google.com/macros/s/AKfycbwmWUMS8xv989OHGPNeqAtENmUdLUAeVZUUVieThSbBQcFbtPfFEJETToLpViYuGkXn/exec">direkt öffnen</a>
    </div>
  </div>

  <iframe
    id="app"
    title="Mako Personalplaner"
    src="https://script.google.com/macros/s/AKfycbwmWUMS8xv989OHGPNeqAtENmUdLUAeVZUUVieThSbBQcFbtPfFEJETToLpViYuGkXn/exec"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <button id="pushButton" type="button">🔔 Benachrichtigungen aktivieren</button>

  <script>
    const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD834l6nojbMm0_As_82mkQ9lfah9p1EDk",
  authDomain: "mako-personalplaner.firebaseapp.com",
  projectId: "mako-personalplaner",
  storageBucket: "mako-personalplaner.firebasestorage.app",
  messagingSenderId: "606569515655",
  appId: "1:606569515655:web:fc90bc032679ad8f814622"
};
    const VAPID_KEY = "BNxTtWe7mJ7Xrpz7u-MmRYmEz8raYyWlgg-JiM8GhauGznsy26_x9NjEUNRGM2koEn6hGbM9y4YRakGvKWgQ3Sc";

    const appFrame = document.getElementById("app");
    const pushButton = document.getElementById("pushButton");

    let currentUsername = "";
    let swRegistration = null;
    let messaging = null;

    firebase.initializeApp(FIREBASE_CONFIG);
    messaging = firebase.messaging();

    async function setupServiceWorker() {
      if (!("serviceWorker" in navigator)) {
        return null;
      }

      swRegistration = await navigator.serviceWorker.register("./service-worker.js");
      await navigator.serviceWorker.ready;
      return swRegistration;
    }

    function updatePushButton() {
      if (!currentUsername) {
        pushButton.style.display = "none";
        return;
      }

      if (!("Notification" in window)) {
        pushButton.style.display = "none";
        return;
      }

      if (Notification.permission === "granted") {
        pushButton.style.display = "none";
        registerCurrentDevice().catch(console.error);
        return;
      }

      if (Notification.permission === "denied") {
        pushButton.style.display = "none";
        return;
      }

      pushButton.style.display = "block";
    }

    async function registerCurrentDevice() {
      if (!currentUsername) {
        return;
      }

      if (!swRegistration) {
        swRegistration = await setupServiceWorker();
      }

      if (!swRegistration || Notification.permission !== "granted") {
        return;
      }

      const token = await messaging.getToken({
        vapidKey: VAPID_KEY,
        serviceWorkerRegistration: swRegistration
      });

      if (!token) {
        throw new Error("Kein FCM-Token erhalten.");
      }

      appFrame.contentWindow.postMessage(
        {
          type: "MAKO_PUSH_TOKEN",
          username: currentUsername,
          token: token,
          platform: navigator.userAgent || ""
        },
        "*"
      );
    }

    pushButton.addEventListener("click", async () => {
      pushButton.disabled = true;
      pushButton.textContent = "🔔 Wird aktiviert …";

      try {
        const permission = await Notification.requestPermission();

        if (permission !== "granted") {
          pushButton.style.display = "none";
          return;
        }

        await registerCurrentDevice();

        pushButton.style.display = "none";
      } catch (err) {
        console.error("Push-Aktivierung fehlgeschlagen:", err);
        pushButton.disabled = false;
        pushButton.textContent = "🔔 Benachrichtigungen aktivieren";
      }
    });

    window.addEventListener("message", event => {
      const data = event.data || {};

      if (data.type === "MAKO_USER_LOGIN") {
        currentUsername = String(data.username || "").trim();
        updatePushButton();
      }

      if (data.type === "MAKO_USER_LOGOUT") {
        currentUsername = "";
        updatePushButton();
      }
    });

    messaging.onMessage(payload => {
      if (Notification.permission !== "granted") {
        return;
      }

      const data = payload.data || {};
      const title = data.title || "Mako Personalplaner";
      const body = data.body || "Neue Mitteilung";
      const url = data.url || "./";

      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.ready.then(registration => {
          registration.showNotification(title, {
            body: body,
            icon: "./mako-icon-192.png",
            badge: "./mako-icon-192.png",
            data: { url: url }
          });
        });
      }
    });

    setupServiceWorker()
      .then(() => updatePushButton())
      .catch(err => console.error("Service Worker:", err));
  </script>
</body>
</html>
